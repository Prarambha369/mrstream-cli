<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .title-bar { fill: #181825; }
      .title-text { font: 12px monospace; fill: #cdd6f4; }
      .dot { fill: #45475a; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
      .terminal-text { font: 13px 'Cascadia Code','Fira Code','JetBrains Mono','Monaco','Menlo',monospace; }
      .cyan { fill: #89dceb; }
      .green { fill: #a6e3a1; }
      .yellow { fill: #f9e2af; }
      .dim { fill: #6c7086; }
      .white { fill: #cdd6f4; }
      .red { fill: #f38ba8; }
      .pink { fill: #f5c2e7; }
    </style>
  </defs>

  <!-- Window -->
  <rect class="bg" x="0" y="0" width="720" height="540" rx="8"/>
  <rect class="title-bar" x="0" y="0" width="720" height="32" rx="8"/>
  <rect class="title-bar" x="0" y="16" width="720" height="16"/>

  <!-- Window dots -->
  <circle class="dot-red" cx="18" cy="16" r="5"/>
  <circle class="dot-yellow" cx="36" cy="16" r="5"/>
  <circle class="dot-green" cx="54" cy="16" r="5"/>

  <!-- Window title -->
  <text class="title-text" x="360" y="21" text-anchor="middle">mrstream — Live sports from your terminal</text>

  <!-- Terminal content -->
  <!-- Logo -->
  <text class="terminal-text green" x="20" y="58">  __  __           _            _      </text>
  <text class="terminal-text green" x="20" y="76"> | \/  |         | |          | |     </text>
  <text class="terminal-text green" x="20" y="94"> | \  / |_ __ ___ | |_ ___  ___| |__   </text>
  <text class="terminal-text green" x="20" y="112"> | |\/| | '__/ __|| __/ _ \/ __| '_ \ </text>
  <text class="terminal-text green" x="20" y="130"> | |  | | |  \__ \| ||  __/ (__| | | |</text>
  <text class="terminal-text green" x="20" y="148"> |_|  |_|_|  |___/ \__\___|\___|_| |_|</text>

  <!-- Section divider -->
  <text class="terminal-text white" x="20" y="178">━━━ 1. HELP ━━━</text>

  <!-- Command -->
  <text class="terminal-text dim" x="20" y="200">$ </text>
  <text class="terminal-text cyan" x="35" y="200">./mrstream --help</text>

  <!-- Help output -->
  <text class="terminal-text white" x="20" y="222">MrStream-Cli v0.1.0-alpha — search and play live sports from your terminal.</text>
  <text class="terminal-text white" x="20" y="244">COMMANDS:  search  doctor  update  version</text>
  <text class="terminal-text white" x="20" y="262">OPTIONS:   --refresh  --player  --debug  --help</text>

  <!-- Section divider -->
  <text class="terminal-text white" x="20" y="292">━━━ 3. DOCTOR ━━━</text>

  <text class="terminal-text dim" x="20" y="314">$ </text>
  <text class="terminal-text cyan" x="35" y="314">./mrstream doctor</text>

  <text class="terminal-text red" x="20" y="336">❌ No video player found (need mpv, vlc/cvlc, or mplayer)</text>

  <!-- Section divider -->
  <text class="terminal-text white" x="20" y="366">━━━ 4. LIVE SCHEDULE ━━━</text>

  <!-- Schedule data -->
  <text class="terminal-text yellow" x="20" y="388">06:00</text>
  <text class="terminal-text white" x="70" y="388">Rugby: New Zealand x Italy</text>
  <text class="terminal-text pink" x="310" y="388">SPORTTV2</text>

  <text class="terminal-text yellow" x="20" y="406">09:00</text>
  <text class="terminal-text white" x="70" y="406">MotoGP: Germany Qualifying</text>
  <text class="terminal-text pink" x="310" y="406">HD5</text>

  <text class="terminal-text yellow" x="20" y="424">22:00</text>
  <text class="terminal-text white" x="70" y="424">Norway x England</text>
  <text class="terminal-text pink" x="310" y="424">HD1</text>

  <text class="terminal-text yellow" x="20" y="442">00:00</text>
  <text class="terminal-text white" x="70" y="442">UFC 329: Prelims</text>
  <text class="terminal-text pink" x="310" y="442">HD5</text>

  <text class="terminal-text yellow" x="20" y="460">02:00</text>
  <text class="terminal-text white" x="70" y="460">UFC 329: McGregor vs Holloway</text>
  <text class="terminal-text pink" x="310" y="460">HD5</text>

  <!-- Prompt -->
  <text class="terminal-text green" x="20" y="490">━</text>
  <text class="terminal-text cyan" x="30" y="490"> Demo Complete</text>
  <text class="terminal-text green" x="200" y="490"> ━</text>

  <text class="terminal-text dim" x="20" y="515">Use 'mrstream search' to browse all events interactively.</text>

  <!-- Cursor -->
  <rect x="250" y="518" width="8" height="2" fill="#cdd6f4" opacity="0.6"/>
</svg>
